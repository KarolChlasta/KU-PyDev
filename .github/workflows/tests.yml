name: Testy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testy:
    # W repozytorium prowadzącego są tylko startery – testy uruchamiamy w forkach studentów.
    if: github.repository != 'KarolChlasta/KU-PyDev'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab:
          - lab01_podstawy
          - lab02_zmienne_typy
          - lab03_warunki
          - lab04_petle
          - lab05_listy_krotki
          - lab06_slowniki_zbiory
          - lab07_funkcje
          - lab09_pliki
          - lab10_moduly_pakiety
          - lab11_daty_math
          - lab12_wyjatki
          - lab13_sortowanie
          - lab14_testy_tdd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Testy obowiązkowe – ${{ matrix.lab }}
        working-directory: ${{ matrix.lab }}
        run: python -m unittest discover -s tests -p "test_obowiazkowe.py" -v
